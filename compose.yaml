# =============================================================================
# Production Docker Compose for GS Crawler Stack
# GENERATED FILE - Do not edit directly!
# Edit crawlers.yaml and run: python scripts/generate-compose.py
# Uses pre-built images from GitHub Container Registry
# =============================================================================

# Gemeinsame Härtung: kein Root, schreibgeschütztes Dateisystem, keine Capabilities.
# Beschreibbar sind nur /tmp (tmpfs) und die gemounteten Ordner.
x-crawler-defaults: &crawler-defaults
  user: "${CRAWLER_UID:?CRAWLER_UID fehlt (UID des Hosting-Users, siehe .env.example)}:${CRAWLER_GID:?CRAWLER_GID fehlt (GID des Hosting-Users, siehe .env.example)}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  init: true
  restart: unless-stopped

services:
  # === INFRASTRUCTURE ===
  gs_health_monitor:
    <<: *crawler-defaults
    image: ghcr.io/machmitgoslar/gs_crawler_000_health_monitor:latest
    volumes:
      - type: bind
        source: ./httpdocs/crawler
        target: /app/output
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./httpdocs/crawler/000_health_monitor
        target: /app/output/000_health_monitor
        bind:
          create_host_path: false
      - type: bind
        source: ./crawlers.yaml
        target: /app/configs/crawlers.yaml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "5015:5000"
    container_name: gs_health_monitor
    depends_on:
      - gs_generic_scraper_simple
      - gs_generic_scraper_tschuessschule

