<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biostadt Goslar</title>
  <link href="ui-kit/goslar-ui.css" rel="stylesheet" />
  <style>
    .biostadt-hero {
      margin-top: 18px;
    }

    .biostadt-hero__image {
      width: 100%;
      max-height: 220px;
      display: block;
      object-fit: cover;
      border-radius: var(--gs-radius-media);
      background: var(--gs-color-background);
    }

    .biostadt-hero__copy {
      margin: 14px 0 0;
      color: var(--gs-color-copy);
      font: 590 13px/21px var(--gs-font-ui);
      letter-spacing: -0.004em;
    }

    .biostadt-section {
      margin-top: 28px;
    }

    .biostadt-section-title {
      margin: 0 0 4px;
      color: var(--gs-color-text);
      font: 700 18px/26px var(--gs-font-ui);
      letter-spacing: -0.004em;
    }

    .biostadt-section-copy {
      margin: 0 0 14px;
      color: var(--gs-color-copy);
      font: 590 13px/21px var(--gs-font-ui);
      letter-spacing: -0.004em;
    }

    .biostadt-articles {
      display: grid;
      gap: 12px;
    }

    .biostadt-toolbar {
      margin-top: 4px;
    }

    .biostadt-count {
      margin: 10px 4px 0;
      color: var(--gs-color-copy);
      font-size: 12px;
      font-weight: 590;
      line-height: 20px;
      letter-spacing: -0.004em;
    }

    .biostadt-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .biostadt-empty {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--gs-radius-card);
      background: var(--gs-color-card);
      color: var(--gs-color-copy);
      font-size: 13px;
      font-weight: 590;
      line-height: 20px;
    }

    @media (min-width: 900px) {
      .biostadt-articles,
      .biostadt-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="gs-body">
  <main class="gs-page">
    <header class="gs-page-header">
      <h1 class="gs-page-title">Biostadt Goslar</h1>
      <p class="gs-page-description" id="page-intro">Goslar isst Bio.</p>
    </header>

    <section class="biostadt-hero" id="hero-image" hidden></section>

    <section class="biostadt-section">
      <h2 class="biostadt-section-title">Alles auf einen Blick</h2>
      <div class="biostadt-articles" id="article-list"></div>
    </section>

    <section class="biostadt-section">
      <h2 class="biostadt-section-title">Bio-Einkaufsführer</h2>
      <p class="biostadt-section-copy" id="map-text"></p>

      <div class="gs-toolbar biostadt-toolbar">
        <label class="gs-search" for="biostadt-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.8 17.1a7.3 7.3 0 1 1 5.2-2.1l4.1 4.1-1.5 1.5-4.1-4.1a7.2 7.2 0 0 1-3.7.6Zm0-2.1a5.2 5.2 0 1 0 0-10.4 5.2 5.2 0 0 0 0 10.4Z" />
          </svg>
          <input class="gs-search-input" id="biostadt-search" type="search" placeholder="Orte suchen ..." autocomplete="off" />
        </label>
      </div>
      <div class="biostadt-count" id="biostadt-count"></div>

      <section class="biostadt-list" id="biostadt-list" aria-live="polite"></section>
      <div class="biostadt-empty" id="biostadt-empty">Keine Orte gefunden.</div>
    </section>
  </main>

  <button class="gs-scroll-top" type="button" data-gs-scroll-top aria-label="Nach oben scrollen">↑</button>

  <script src="ui-kit/goslar-ui.js"></script>
  <script>
    const BIOSTADT = __BIOSTADT_JSON__;
    const state = { query: '' };

    renderIntro();
    renderArticles();
    renderEinkaufsfuehrer();

    const searchInput = document.getElementById('biostadt-search');
    searchInput.addEventListener('input', () => {
      state.query = searchInput.value.trim();
      renderEinkaufsfuehrer();
    });

    function renderIntro() {
      const introEl = document.getElementById('page-intro');
      if (BIOSTADT.intro) {
        introEl.textContent = BIOSTADT.intro;
      }

      const heroEl = document.getElementById('hero-image');
      if (BIOSTADT.image_url) {
        heroEl.innerHTML = '<img class="biostadt-hero__image" src="' + escapeAttr(BIOSTADT.image_url) + '" alt="" loading="lazy" />';
        heroEl.hidden = false;
      }
    }

    function renderArticles() {
      const list = document.getElementById('article-list');
      list.innerHTML = '';
      for (const article of BIOSTADT.artikel || []) {
        const element = document.createElement('a');
        element.className = 'gs-list-widget';
        element.href = article.call_to_action_url;
        element.target = '_blank';
        element.rel = 'noopener noreferrer';
        element.innerHTML = ''
          + '<div class="gs-list-widget__content">'
          + '<h3 class="gs-list-widget__title">' + escapeHtml(article.title || '') + '</h3>'
          + '<p class="gs-list-widget__copy">' + escapeHtml(article.teaser || '') + '</p>'
          + '<div class="gs-list-widget__cta">Auf goslar.de lesen →</div>'
          + '</div>';
        list.appendChild(element);
      }
    }

    function renderEinkaufsfuehrer() {
      const einkaufsfuehrer = BIOSTADT.einkaufsfuehrer || { items: [], count: 0, map_text: '' };
      document.getElementById('map-text').textContent = einkaufsfuehrer.map_text || '';

      const items = filterItems(einkaufsfuehrer.items || [], state.query);
      const list = document.getElementById('biostadt-list');
      const count = document.getElementById('biostadt-count');
      const empty = document.getElementById('biostadt-empty');

      list.innerHTML = '';
      count.textContent = items.length + ' von ' + (einkaufsfuehrer.items || []).length + ' Orten';
      empty.style.display = items.length ? 'none' : 'block';

      for (const item of items) {
        const element = document.createElement('a');
        element.className = 'gs-list-widget';
        element.href = item.call_to_action_url;
        element.innerHTML = ''
          + '<div class="gs-list-widget__content">'
          + '<h3 class="gs-list-widget__title">' + escapeHtml(item.title || '') + '</h3>'
          + '<p class="gs-list-widget__copy">' + escapeHtml(item.description || '') + '</p>'
          + '<div class="gs-list-widget__cta">Details ansehen →</div>'
          + '</div>';
        list.appendChild(element);
      }
    }

    function filterItems(items, query) {
      const normalizedQuery = normalizeSearch(query);
      if (!normalizedQuery) return items;
      return items.filter(item => normalizeSearch([
        item.title,
        item.category,
        item.address,
      ].filter(Boolean).join(' ')).includes(normalizedQuery));
    }

    function normalizeSearch(value) {
      return String(value || '')
        .toLocaleLowerCase('de-DE')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ß/g, 'ss')
        .trim();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
