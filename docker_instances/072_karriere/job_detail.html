<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job – Goslar</title>
  <link href="/ui-kit/goslar-ui.css" rel="stylesheet" />
  <style>
    :root {
      --color-background: var(--gs-color-background, #f5f5f5);
      --color-backgroundTile: var(--gs-color-card, #ffffff);
      --color-primary: var(--gs-color-gold, #a88f35);
      --color-primary-dark: #806b1f;
      --color-text: var(--gs-color-text, #000000);
      --color-muted: var(--gs-color-copy, #3f3f3e);
      --color-border: #dbdbdb;
      --color-error: #b42318;
      --font-family: var(--gs-font-ui, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-family);
      text-align: left;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, textarea, select { font: inherit; }

    header {
      background: var(--color-background);
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 14px 19px 8px;
    }

    header a {
      width: 24px;
      height: 24px;
      color: var(--color-primary);
      cursor: pointer;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    header a.gs-back-link {
      width: 24px;
      height: 24px;
      justify-content: center;
    }

    header a:focus-visible,
    .back-btn:focus-visible,
    .application-link:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 4px;
    }

    header h1 {
      margin: 0;
      color: var(--color-text);
      font-size: 18px;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: -0.4px;
    }

    header .gs-page-title {
      margin: 0;
      font-size: 18px;
      line-height: 28px;
      letter-spacing: -0.4px;
    }

    #loading,
    #error {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 104px;
      padding: 18px 19px;
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 590;
      line-height: 20px;
    }

    #error { display: none; color: var(--color-error); }
    #content { display: none; }

    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      max-width: none;
      margin: 0;
      overflow: visible;
    }

    .detail-sidebar {
      display: none;
    }

    .detail-sidebar.has-logo {
      display: block;
    }

    .logo-wrap {
      width: 100%;
      height: 213px;
      background: #ece8db;
      overflow: hidden;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .card-body { padding: 19px; }

    .vendor-name {
      margin: 0 0 14px;
      color: var(--color-text);
      font-size: 27px;
      font-weight: 700;
      line-height: 34px;
      letter-spacing: -0.4px;
    }

    .market-event,
    .application-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 0 0 17px;
      padding: 14px 18px;
      background: var(--color-backgroundTile);
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 8px #0000000a, 0 2px 4px #00000005;
    }

    .market-event-date,
    .market-event-location,
    .application-copy,
    .application-value,
    .vendor-summary {
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 590;
      line-height: 20px;
      letter-spacing: -0.004em;
    }

    .market-event-date,
    .application-value { color: var(--color-text); font-weight: 700; }

    .application-info { display: none; gap: 10px; }

    .application-info h2,
    .grave-section-heading {
      margin: 0;
      color: var(--color-text);
      font-size: 18px;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: -0.004em;
    }

    .application-copy { margin: 0; }

    .application-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px 16px;
    }

    .application-item { min-width: 0; }

    .application-label {
      display: block;
      margin-bottom: 2px;
      color: #6b675f;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
    }

    .application-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 16px;
      background: var(--color-primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      line-height: 28px;
      margin-top: 1rem;
      width: 100%;
    }

    .application-link:hover { color: #fff; background: var(--color-primary-dark); }

    .vendor-summary {
      margin: 0 0 17px;
      font-size: 14px;
      line-height: 24px;
    }

    .vendor-description {
      color: var(--color-text);
      font-size: 14px;
      font-weight: 400;
      line-height: 34px;
      letter-spacing: -0.4px;
    }

    .vendor-description p { margin: 0 0 18px; }
    .vendor-description p:last-child { margin-bottom: 0; }
    .vendor-description ul,
    .vendor-description ol { padding-left: 1.2rem; margin: 0 0 18px; }
    .vendor-description a { color: var(--color-primary); font-weight: 700; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 19px 32px;
      padding: 0;
      background: transparent;
      color: var(--color-primary);
      border-radius: 0;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      line-height: 34px;
      letter-spacing: -0.4px;
    }

    .back-btn:hover { color: var(--color-primary-dark); background: transparent; }

    @media (min-width: 768px) {
      header { padding: 24px 32px 12px; }
      header h1 { font-size: 21px; line-height: 30px; }
      header .gs-page-title { font-size: 21px; line-height: 30px; }
      .logo-wrap { height: 320px; }
      .card-body { padding: 28px 32px 48px; }
      .vendor-name { font-size: 34px; line-height: 42px; }
      .vendor-summary,
      .vendor-description { max-width: 820px; font-size: 16px; line-height: 34px; }
      .market-event,
      .application-info { max-width: 820px; }
      .back-btn { margin-inline: 32px; }
    }

    @media (min-width: 900px) {
      header {
        max-width: 1180px;
        margin: 0 auto;
        padding-inline: 48px;
      }

      #content {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 48px 56px;
      }

      .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 10px 34px;
        align-items: start;
      }

      .detail-sidebar {
        grid-column: 2;
        grid-row: 1;
        flex-direction: column;
        gap: 10px;
      }

      .detail-sidebar.has-logo {
        display: flex;
      }

      .logo-wrap {
        height: 240px;
        border-radius: 18px;
        box-shadow: 0 8px 20px #0000000a;
      }

      .logo-wrap img {
        object-fit: contain;
        padding: 34px;
        background: #fff;
      }

      .card-body {
        grid-column: 1;
        grid-row: 1 / span 2;
        padding: 28px 0 0;
      }

      .vendor-name {
        max-width: 760px;
        margin-bottom: 8px;
        font-size: 36px;
        line-height: 44px;
      }

      .vendor-summary,
      .vendor-description {
        max-width: 760px;
      }

      .market-event {
        max-width: 760px;
      }

      .application-info {
        max-width: none;
        margin: 0;
      }

      .application-grid {
        grid-template-columns: 1fr;
      }

      .application-link {
        width: 100%;
        min-width: 0;
        padding-inline: 34px;
      }

      .back-btn {
        margin: 18px 0 0;
      }
    }

    @media (min-width: 1200px) {
      header { padding-inline: 24px; }
      #content { padding-inline: 24px; }
      .card {
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 10px 48px;
      }
      .logo-wrap { height: 260px; }
    }
  </style>
</head>
<body class="gs-body">
<header>
  <a class="gs-back-link" id="back-btn" href="/karriere/" aria-label="Zurück">←</a>
  <h1 class="gs-page-title" id="market-name">Karriere Goslar</h1>
</header>

<div id="loading">Job wird geladen…</div>
<div id="error"></div>

<div id="content">
  <div class="card">
    <div class="detail-sidebar" id="detail-sidebar">
    </div>
    <div class="card-body">
      <div class="vendor-name" id="vendor-name"></div>
      <div class="market-event" id="market-event" style="display:none">
        <div class="market-event-date" id="market-event-date"></div>
        <div class="market-event-location" id="market-event-location"></div>
      </div>
      <div class="application-info" id="application-info">
        <h2>Bewerbungsinfos</h2>
        <div id="application-info-lines"></div>
      </div>
      <div class="vendor-summary" id="vendor-summary"></div>
      <div class="vendor-description" id="vendor-description"></div>
    </div>
  </div>
  <a class="back-btn" id="back-link" href="/karriere/">← Zur Übersicht</a>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const source = params.get('source') || 'bundesapi';
  const APP_BASE_PATH = __APP_BASE_PATH__;
  const DETAILS_DATA_URL = __DETAILS_DATA_URL__;
  const EMBEDDED_DETAILS_DATA = __DETAILS_DATA_JSON__;
  const STATIC_INDEX_URL = __STATIC_INDEX_URL__;
  const LIST_STATE_KEY = 'karriere:list-state:v1';
  const INDEX_PAGE = staticIndexPath();
  const RETURN_PAGE = getSavedListUrl() || INDEX_PAGE;

  document.getElementById('back-btn').href = RETURN_PAGE;
  document.getElementById('back-link').href = RETURN_PAGE;

  async function load() {
    if (!id) {
      showError('Kein Job angegeben. Bitte gehe zurück zur Übersicht.');
      return;
    }

    try {
      const details = await loadDetailsPayload();
      const job = resolveJobDetail(details);
      if (!job) throw new Error('Keine Detaildaten für dieses Angebot gefunden.');

      document.title = (job.title ?? 'Job') + ' – Landkreis Goslar';
      document.getElementById('vendor-name').textContent = job.title || '';
      document.getElementById('vendor-summary').textContent = job.summary || job.employer || '';
      document.getElementById('vendor-description').innerHTML = renderRichText(job.description_html || '');

      if (job.published_at || job.location) {
        if (job.published_at) document.getElementById('market-event-date').textContent = 'Veröffentlicht: ' + formatDateValue(job.published_at);
        if (job.location) document.getElementById('market-event-location').textContent = job.location;
        document.getElementById('market-event').style.display = 'flex';
      }

      renderApplicationInfo(job);
      renderLogo(job);
      syncApplicationInfoLayout();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    } catch (e) {
      showError('Job konnte nicht geladen werden: ' + e.message);
    }
  }

  async function loadDetailsPayload() {
    if (EMBEDDED_DETAILS_DATA && typeof EMBEDDED_DETAILS_DATA === 'object') {
      return EMBEDDED_DETAILS_DATA;
    }
    const res = await fetch(DETAILS_DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    el.style.display = 'block';
    el.textContent = msg;
  }

  function renderLogo(job) {
    const sidebar = document.getElementById('detail-sidebar');
    if (!sidebar) return;
    sidebar.classList.remove('has-logo');
    sidebar.innerHTML = '';

    if (!job.logo_url) return;

    const wrap = document.createElement('div');
    wrap.className = 'logo-wrap';
    const img = document.createElement('img');
    img.src = job.logo_url;
    img.alt = job.employer || job.title || 'Logo';
    img.onerror = () => {
      sidebar.classList.remove('has-logo');
      sidebar.innerHTML = '';
      syncApplicationInfoLayout();
    };
    wrap.appendChild(img);
    sidebar.appendChild(wrap);
    sidebar.classList.add('has-logo');
  }

  function getSavedListUrl() {
    try {
      const saved = JSON.parse(sessionStorage.getItem(LIST_STATE_KEY) || 'null');
      if (!saved || !saved.listUrl) return '';
      const url = new URL(saved.listUrl, location.origin);
      if (url.origin !== location.origin) return '';
      if (APP_BASE_PATH && !url.pathname.startsWith(APP_BASE_PATH + '/')) return '';
      return url.pathname + url.search;
    } catch {
      return '';
    }
  }

  function renderApplicationInfo(job) {
    const items = [
      ['Beginn', formatStartValue(job.starts_at, job)],
      ['Erstveröffentlicht', job.first_published_at],
      ['Veröffentlichungszeitraum', job.application_period],
      ['Angebotsart', job.employment_type],
      ['Vertragsdauer', job.contract_duration],
      ['Vergütung', job.compensation],
    ].map(([label, value]) => [label, formatValue(value)]).filter(([, value]) => value);

    const wrapper = document.getElementById('application-info');
    const target = document.getElementById('application-info-lines');
    const intro = '<p class="application-copy">Angaben zur Bewerbung und zum Stellenangebot.</p>';
    const itemHtml = items.length
      ? '<div class="application-grid">' + items.map(([label, value]) =>
          '<div class="application-item">'
          + '<span class="application-label">' + escapeHtml(label) + '</span>'
          + '<span class="application-value">' + escapeHtml(value) + '</span>'
          + '</div>'
        ).join('') + '</div>'
      : '';
    const linkHtml = job.external_url
      ? '<a class="application-link gs-action" href="' + escapeHtml(job.external_url) + '" target="_blank" rel="noopener noreferrer">Jetzt bewerben →</a>'
      : '';
    target.innerHTML = intro + itemHtml + linkHtml;
    wrapper.style.display = items.length || linkHtml ? 'flex' : 'none';
  }

  function syncApplicationInfoLayout() {
    const sidebar = document.getElementById('detail-sidebar');
    const body = document.querySelector('.card-body');
    const info = document.getElementById('application-info');
    const summary = document.getElementById('vendor-summary');
    if (!sidebar || !body || !info || !summary) return;

    if (window.matchMedia('(min-width: 900px)').matches && sidebar.classList.contains('has-logo')) {
      if (info.parentElement !== sidebar) sidebar.appendChild(info);
      return;
    }

    if (info.parentElement !== body) body.insertBefore(info, summary);
  }

  window.addEventListener('resize', syncApplicationInfoLayout);

  function formatValue(value) {
    if (value === null || value === undefined || value === '') return '';
    if (Array.isArray(value)) return value.map(formatValue).filter(Boolean).join(', ');
    if (typeof value === 'object') {
      return Object.entries(value)
        .filter(([, entryValue]) => entryValue !== null && entryValue !== undefined && entryValue !== '')
        .map(([key, entryValue]) => {
          const formattedEntry = formatValue(entryValue);
          return formattedEntry ? key + ': ' + formattedEntry : '';
        })
        .filter(Boolean)
        .join(', ');
    }
    const formatted = String(value).trim();
    if (isEmptyInfoValue(formatted)) return '';
    return formatDateValue(formatted);
  }

  function formatDateValue(value) {
    const formatted = String(value || '').trim();
    if (!formatted) return '';

    const dateOnly = parseIsoDate(formatted);
    if (dateOnly) return formatGermanDate(dateOnly);

    return formatted.replace(/\b(\d{4})-(\d{2})-(\d{2})(?:[T\s]\d{2}:\d{2}(?::\d{2}(?:\.\d+)?)?(?:Z|[+-]\d{2}:?\d{2})?)?\b/g, (match) => {
      const date = parseIsoDate(match);
      return date ? formatGermanDate(date) : match;
    });
  }

  function formatStartValue(startsAt, job) {
    const start = String(startsAt || '').trim();
    if (!start) return '';
    if (start.toLocaleLowerCase('de-DE').includes('sofort')) return 'ab sofort';
    const startDate = dateToken(start);
    const comparisonDates = [
      job && job.published_at,
      job && job.first_published_at,
      job && job.application_period,
    ].map(dateToken).filter(Boolean);
    if (startDate && comparisonDates.includes(startDate)) return 'ab sofort';
    return start;
  }

  function parseIsoDate(value) {
    const match = String(value || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
    if (!match) return null;
    const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function formatGermanDate(date) {
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    return day + '.' + month + '.' + date.getFullYear();
  }

  function dateToken(value) {
    const text = String(value || '').trim();
    const iso = text.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];

    const german = text.match(/(\d{2})\.(\d{2})\.(\d{4})/);
    if (german) return german[3] + '-' + german[2] + '-' + german[1];

    return '';
  }

  function isEmptyInfoValue(value) {
    const normalized = String(value || '')
      .trim()
      .toLowerCase()
      .replace(/[_-]+/g, ' ')
      .replace(/\s+/g, ' ');
    return ['keine angabe', 'keine angaben', 'ohne angabe', 'nicht angegeben'].includes(normalized);
  }

  function appPath(path) {
    const normalizedPath = '/' + String(path || '').replace(/^\/+/, '');
    return APP_BASE_PATH ? APP_BASE_PATH + normalizedPath : normalizedPath;
  }

  function staticIndexPath() {
    if (APP_BASE_PATH) return appPath('/');
    return STATIC_INDEX_URL;
  }

  function resolveJobDetail(details) {
    if (!details || typeof details !== 'object') return null;
    return details[source + ':' + id]
      || details['bundesapi:' + id]
      || details[id]
      || null;
  }

  function renderRichText(content) {
    if (!content) return '';
    if (/<[a-z][\s\S]*>/i.test(content)) return content;
    return renderMarkdown(content);
  }

  function renderMarkdown(markdown) {
    const lines = String(markdown).replace(/\r\n/g, '\n').split('\n');
    const html = [];
    let inList = false;
    let paragraph = [];

    const flushParagraph = () => {
      if (!paragraph.length) return;
      html.push('<p>' + inlineMarkdown(paragraph.join(' ').trim()) + '</p>');
      paragraph = [];
    };

    const closeList = () => {
      if (!inList) return;
      html.push('</ul>');
      inList = false;
    };

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) {
        flushParagraph();
        closeList();
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        flushParagraph();
        closeList();
        const level = Math.min(heading[1].length, 6);
        html.push('<h' + level + '>' + inlineMarkdown(heading[2]) + '</h' + level + '>');
        continue;
      }

      const listItem = line.match(/^[-*]\s+(.*)$/);
      if (listItem) {
        flushParagraph();
        if (!inList) {
          html.push('<ul>');
          inList = true;
        }
        html.push('<li>' + inlineMarkdown(listItem[1]) + '</li>');
        continue;
      }

      closeList();
      paragraph.push(line);
    }

    flushParagraph();
    closeList();
    return html.join('');
  }

  function inlineMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return html;
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  load();
</script>
</body>
</html>
