<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freiwilligenagentur Goslar</title>
  <link href="ui-kit/goslar-ui.css" rel="stylesheet" />
  <style>
    .volunteer-toolbar {
      margin-top: 18px;
    }

    .volunteer-count {
      margin: 10px 4px 0;
      color: var(--gs-color-copy);
      font-size: 12px;
      font-weight: 590;
      line-height: 20px;
      letter-spacing: -0.004em;
    }

    .volunteer-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .volunteer-empty {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--gs-radius-card);
      background: var(--gs-color-card);
      color: var(--gs-color-copy);
      font-size: 13px;
      font-weight: 590;
      line-height: 20px;
    }

    .volunteer-meta {
      margin-top: 8px;
      color: var(--gs-color-copy);
      font-size: 11px;
      font-weight: 590;
      line-height: 16px;
      letter-spacing: -0.004em;
    }

    @media (min-width: 900px) {
      .volunteer-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="gs-body">
  <main class="gs-page">
    <header class="gs-page-header">
      <h1 class="gs-page-title">Freiwilligenagentur</h1>
      <p class="gs-page-description">Engagement-Angebote in Goslar finden und direkt Kontakt aufnehmen.</p>
      <div class="gs-toolbar volunteer-toolbar">
        <label class="gs-search" for="volunteer-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.8 17.1a7.3 7.3 0 1 1 5.2-2.1l4.1 4.1-1.5 1.5-4.1-4.1a7.2 7.2 0 0 1-3.7.6Zm0-2.1a5.2 5.2 0 1 0 0-10.4 5.2 5.2 0 0 0 0 10.4Z" />
          </svg>
          <input class="gs-search-input" id="volunteer-search" type="search" placeholder="Angebote suchen ..." autocomplete="off" />
        </label>
      </div>
      <div class="volunteer-count" id="volunteer-count"></div>
    </header>

    <section class="volunteer-list" id="volunteer-list" aria-live="polite"></section>
    <div class="volunteer-empty" id="volunteer-empty">Keine Angebote gefunden.</div>
  </main>

  <script>
    const VOLUNTEER_OFFERS = __OFFERS_JSON__;
    const state = { query: '' };

    const searchInput = document.getElementById('volunteer-search');
    const list = document.getElementById('volunteer-list');
    const count = document.getElementById('volunteer-count');
    const empty = document.getElementById('volunteer-empty');

    searchInput.addEventListener('input', () => {
      state.query = searchInput.value.trim();
      renderOffers();
    });

    renderOffers();

    function renderOffers() {
      const offers = filterOffers(VOLUNTEER_OFFERS || [], state.query);
      list.innerHTML = '';
      count.textContent = offers.length + ' von ' + (VOLUNTEER_OFFERS || []).length + ' Angeboten';
      empty.style.display = offers.length ? 'none' : 'block';

      for (const offer of offers) {
        const element = document.createElement(offer.call_to_action_url ? 'a' : 'article');
        element.className = 'gs-list-widget volunteer-widget';
        if (offer.call_to_action_url) {
          element.href = offer.call_to_action_url;
          element.target = '_blank';
          element.rel = 'noopener noreferrer';
        }

        element.innerHTML = ''
          + '<div class="gs-list-widget__content">'
          + '<h2 class="gs-list-widget__title">' + escapeHtml(offer.title || 'Engagement-Angebot') + '</h2>'
          + '<p class="gs-list-widget__copy">' + escapeHtml(offer.description || '') + '</p>'
          + '<div class="gs-list-widget__cta">Angebot öffnen →</div>'
          + '<div class="volunteer-meta">' + escapeHtml(formatPublishedAt(offer.published_at)) + '</div>'
          + '</div>';
        list.appendChild(element);
      }
    }

    function filterOffers(offers, query) {
      const normalizedQuery = normalizeSearch(query);
      if (!normalizedQuery) return offers;
      return offers.filter(offer => normalizeSearch([
        offer.title,
        offer.description,
        offer.published_at,
      ].filter(Boolean).join(' ')).includes(normalizedQuery));
    }

    function normalizeSearch(value) {
      return String(value || '')
        .toLocaleLowerCase('de-DE')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ß/g, 'ss')
        .trim();
    }

    function formatPublishedAt(value) {
      if (!value) return '';
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return value;
      return 'Aktualisiert am ' + match[3] + '.' + match[2] + '.' + match[1];
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
