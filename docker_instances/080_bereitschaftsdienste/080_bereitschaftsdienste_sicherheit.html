<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Behörden &amp; Sicherheit Goslar</title>
  <style>
    :root {
      --color-background: #f5f5f5;
      --color-card: #ffffff;
      --color-text: #000000;
      --color-copy: #3f3f3e;
      --color-gold: #a88f35;
      --radius-card: 16px;
      --font-ui: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--color-background);
    }

    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .safety-page {
      width: 100%;
      min-height: 100vh;
      max-width: 390px;
      margin: 0 auto;
      padding: 14px 15px 32px;
      background: var(--color-background);
    }

    .back-link {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      color: var(--color-gold);
      text-decoration: none;
    }

    .back-link svg {
      width: 24px;
      height: 24px;
      display: block;
      fill: currentColor;
    }

    .page-title {
      margin: 7px 4px 0;
      color: var(--color-text);
      font-size: 27px;
      font-weight: 700;
      line-height: 34px;
      letter-spacing: -1.4px;
    }

    .page-intro {
      margin: 4px 4px 0;
      color: var(--color-copy);
      font-size: 12px;
      font-weight: 590;
      line-height: 20px;
      letter-spacing: -0.004em;
    }

    .contact-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .contact-button {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 14px;
      border-radius: var(--radius-card);
      background: var(--color-card);
      color: var(--color-gold);
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .contact-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(28, 25, 18, 0.08);
    }

    .contact-button:focus-visible,
    .portal-widget:focus-visible,
    .back-link:focus-visible {
      outline: 3px solid rgba(168, 143, 53, 0.35);
      outline-offset: 2px;
    }

    .contact-title {
      color: var(--color-gold);
      font-size: 18px;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: -0.004em;
    }

    .call-badge {
      width: 33px;
      height: 33px;
      flex: 0 0 33px;
      display: grid;
      place-items: center;
      border: 1px solid var(--color-gold);
      border-radius: 999px;
      color: var(--color-gold);
    }

    .call-badge svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .portal-widget {
      min-height: 115px;
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 13px;
      align-items: center;
      margin-top: 12px;
      padding: 16px 14px;
      border-radius: var(--radius-card);
      background: var(--color-card);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .portal-widget:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(28, 25, 18, 0.08);
    }

    .portal-image {
      width: 86px;
      height: 83px;
      display: block;
      border-radius: 12px;
      object-fit: cover;
      overflow: hidden;
    }

    .portal-title {
      display: block;
      margin: 0 0 4px;
      color: var(--color-gold);
      font-size: 18px;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: -0.004em;
    }

    .portal-copy {
      display: block;
      margin: 0;
      color: var(--color-copy);
      font-size: 12px;
      font-weight: 590;
      line-height: 20px;
      letter-spacing: -0.004em;
    }

    @media (min-width: 720px) {
      html {
        background:
          radial-gradient(circle at 50% 0%, rgba(168, 143, 53, 0.12), transparent 28rem),
          var(--color-background);
      }

      body { background: transparent; }

      .safety-page {
        max-width: none;
        padding-left: clamp(24px, 5vw, 72px);
        padding-right: clamp(24px, 5vw, 72px);
        padding-bottom: 40px;
        background: transparent;
      }
    }
  </style>
</head>
<body>
  <main class="safety-page" aria-label="Behörden und Sicherheit Goslar">
    <a class="back-link" href="080_bereitschaftsdienste_index.html" aria-label="Zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11H7.83l5.59-5.59L12 4 4 12l8 8 1.42-1.41L7.83 13H20v-2Z" />
      </svg>
    </a>

    <h1 class="page-title">Behörden &amp; Sicherheit</h1>
    <p class="page-intro">Direkter Kontakt zu wichtigen Institutionen.</p>

    <section class="contact-list" aria-label="Direkte Notrufkontakte">
      <a class="contact-button" href="tel:110">
        <span class="contact-title">Polizei: 110</span>
        <span class="call-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.28-.28.67-.36 1.02-.25 1.12.37 2.32.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2Z" />
          </svg>
        </span>
      </a>

      <a class="contact-button" href="tel:112">
        <span class="contact-title">Feuerwehr: 112</span>
        <span class="call-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.28-.28.67-.36 1.02-.25 1.12.37 2.32.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2Z" />

      <a class="contact-button" href="tel:112">
        <span class="contact-title">Rettungsdienst: 112</span>
        <span class="call-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.28-.28.67-.36 1.02-.25 1.12.37 2.32.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2Z" />

        </span>

      <a class="contact-button" href="https://www.nora-notruf.de/" target="_blank" rel="noopener noreferrer">
        <span class="contact-title">nora Notruf App</span>
      </a>
    </section>

    <a class="portal-widget" href="https://www.goslar.de/stadt-und-verwaltung/verwaltung/brand-und-katastrophenschutz" target="_blank" rel="noopener noreferrer">
      <img class="portal-image" src="csm__bkf5951-bearbeitet_65e837eae0.jpg" alt="" loading="lazy" />
      <span>
        <span class="portal-title">Katastrophenschutz</span>
        <span class="portal-copy">Die Stadt Goslar informiert zum Thema Brand- und Bevölkerungsschutz.</span>
      </span>
    </a>
  </main>
</body>
</html>
